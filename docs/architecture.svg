<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <rect width="960" height="520" fill="#0d1117"/>

  <!-- Layer 1 -->
  <rect x="40" y="40" width="880" height="90" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="60" y="68" fill="#58a6ff" font-size="15" font-weight="600">LAYER 1 — ALWAYS LOADED</text>
  <rect x="60" y="80" width="200" height="34" rx="6" fill="#1f6feb" stroke="#58a6ff"/>
  <text x="160" y="102" fill="#ffffff" font-size="13" text-anchor="middle" font-weight="600">MEMORY.md</text>
  <text x="280" y="96" fill="#8b949e" font-size="12">the pointer index — ≤ 2,000 chars, in every prompt</text>
  <text x="280" y="114" fill="#8b949e" font-size="12">one line per topic · no summaries · points at files</text>

  <!-- arrow down -->
  <path d="M480 130 L480 175" stroke="#30363d" stroke-width="2"/>
  <path d="M474 169 L480 181 L486 169" fill="#30363d"/>
  <text x="496" y="160" fill="#8b949e" font-size="11">read on demand</text>

  <!-- Layer 2 -->
  <rect x="40" y="182" width="880" height="150" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="60" y="210" fill="#3fb950" font-size="15" font-weight="600">LAYER 2 — THE LIBRARY (unlimited)</text>
  <text x="60" y="228" fill="#8b949e" font-size="11">Markdown files in chapters, each with an INDEX.md</text>

  <rect x="60" y="242" width="120" height="30" rx="5" fill="#21262d" stroke="#30363d"/>
  <text x="120" y="261" fill="#c9d1d9" font-size="11" text-anchor="middle">operating/</text>
  <rect x="190" y="242" width="105" height="30" rx="5" fill="#21262d" stroke="#30363d"/>
  <text x="242" y="261" fill="#c9d1d9" font-size="11" text-anchor="middle">people/</text>
  <rect x="305" y="242" width="105" height="30" rx="5" fill="#21262d" stroke="#30363d"/>
  <text x="357" y="261" fill="#c9d1d9" font-size="11" text-anchor="middle">projects/</text>
  <rect x="420" y="242" width="85" height="30" rx="5" fill="#21262d" stroke="#30363d"/>
  <text x="462" y="261" fill="#c9d1d9" font-size="11" text-anchor="middle">log/</text>
  <rect x="515" y="242" width="95" height="30" rx="5" fill="#21262d" stroke="#30363d"/>
  <text x="562" y="261" fill="#c9d1d9" font-size="11" text-anchor="middle">events/</text>
  <rect x="620" y="242" width="85" height="30" rx="5" fill="#21262d" stroke="#30363d"/>
  <text x="662" y="261" fill="#c9d1d9" font-size="11" text-anchor="middle">state/</text>
  <rect x="715" y="242" width="100" height="30" rx="5" fill="#21262d" stroke="#30363d"/>
  <text x="765" y="261" fill="#c9d1d9" font-size="11" text-anchor="middle">archive/</text>
  <rect x="825" y="242" width="75" height="30" rx="5" fill="#21262d" stroke="#30363d"/>
  <text x="862" y="261" fill="#c9d1d9" font-size="11" text-anchor="middle">scripts/</text>

  <text x="60" y="296" fill="#8b949e" font-size="11">Index → chapter index → the file. Three reads, each one smaller than the last.</text>
  <text x="60" y="316" fill="#8b949e" font-size="11">Read before write. Archive before overwrite. Never fabricate.</text>

  <!-- Layer 3 + 4 -->
  <rect x="40" y="352" width="425" height="120" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="60" y="378" fill="#d29922" font-size="15" font-weight="600">LAYER 3 — TRANSCRIPTS</text>
  <text x="60" y="398" fill="#8b949e" font-size="11">Raw chat history, in the agent framework's session store.</text>
  <text x="60" y="416" fill="#8b949e" font-size="11">Searchable. Not curated. Your framework manages it.</text>
  <text x="60" y="444" fill="#6e7681" font-size="11">"I remember bits and pieces from three weeks ago."</text>

  <rect x="495" y="352" width="425" height="120" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="515" y="378" fill="#bc8cff" font-size="15" font-weight="600">LAYER 4 — FACTS (optional)</text>
  <text x="515" y="398" fill="#8b949e" font-size="11">Typed, entity-linked facts in SQLite for cross-entity queries.</text>
  <text x="515" y="416" fill="#8b949e" font-size="11">"Everything about project X." Skip it until you need it.</text>
  <text x="515" y="444" fill="#6e7681" font-size="11">Most agents never need this layer.</text>

  <text x="480" y="500" fill="#6e7681" font-size="11" text-anchor="middle">The index never grows with the library. That is the invariant.</text>
</svg>
